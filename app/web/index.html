<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href` (the app is served from the site root by default). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Messenger — encrypted chats, groups, polls and message search in your browser.">
  <meta name="theme-color" content="#3949AB">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Messenger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Messenger</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fbf8ff; }
    @media (prefers-color-scheme: dark) { html, body { background: #121318; } }
    /* Shown until Flutter renders its first frame (splash.js removes it on 'flutter-first-frame'). */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 16px; font: 15px system-ui, sans-serif; color: #5c5f71; }
    #splash .ring { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #3949AB33; border-top-color: #3949AB;
                    animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite"><div class="ring"></div><div>Loading Messenger…</div></div>
  <noscript>Messenger needs JavaScript to run.</noscript>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
